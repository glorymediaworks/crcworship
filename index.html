    .trans-none { animation: transNone 0ms ease-in-out; }
    .trans-fade { animation: transFade 400ms ease-in-out; }
    .trans-fade-black { animation: transFadeBlack 500ms ease-in-out; }
    .trans-slide-left { animation: transSlideLeft 400ms ease-in-out; }
    .trans-slide-right { animation: transSlideRight 400ms ease-in-out; }
    .trans-slide-up { animation: transSlideUp 400ms ease-in-out; }
    .trans-zoom { animation: transZoom 400ms ease-in-out; }
    .trans-blur { animation: transBlur 500ms ease-in-out; }

    @keyframes transNone {
      from { opacity: 1; }
      to { opacity: 1; }
    }
    @keyframes transFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes transFadeBlack {

    }
    @keyframes transSlideRight {
      from { opacity: 0; transform: translateX(-100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes transSlideUp {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes transZoom {

    // ============================================================
    //  LINE-BASED LYRIC PARSER (PAIRED LINES + COMMA BREAK + 5-WORD LIMIT)
    //  - Section tags like [Verse 1], [Chorus], [Bridge] switch the
    //    section but are NOT emitted as standalone slides.
    //  - PAIRED LINES: consecutive lyric lines are grouped 2-at-a-time
    //    so that 2 lines form ONE slide unit.
    //    Example: Line 1 "God of Jacob," + Line 2 "Great I Am" → 1 slide.
    //  - COMMA SPLITTING: if a line contains a mid-sentence comma
    //    (not at the very end), force a line break at the comma
    //    within that slide.
    //  - 5-WORD LIMIT: phrases longer than 5 words wrap into a neat
    //    2nd/3rd line so no line on the slide exceeds 5 words.
    //  - Returns { slides, sectionsJson }
    // ============================================================
    function parseLyricsToSlides(itemId, rawText) {
      const slides = [];
      const sectionsJson = [];
      let currentTag = 'VERSE 1';
      let currentSectionPlainLines = [];
      let currentSectionSlides = [];

      // Split an array of words into balanced chunks of max 5 words.
      const chunkText = (words) => {
        const nChunks = Math.max(Math.ceil(words.length / 5), 1);
        const base = Math.floor(words.length / nChunks);
        let extra = words.length % nChunks;
        const chunks = [];
        let i = 0;
        for (let c = 0; c < nChunks; c++) {
          const size = base + (extra > 0 ? 1 : 0);
          if (extra > 0) extra--;
          chunks.push(words.slice(i, i + size).join(' '));
          i += size;
        }
        return chunks;
      };

      // Format a single raw lyric line into display lines (1–3 lines).
      const formatLine = (raw) => {
        const text = raw.replace(/\s+$/g, '').trim();
        if (!text) return [];
        const lines = [];

        // COMMA SPLITTING: split at commas between words (not trailing)
        const commaParts = text.split(/(?<=[^,\s])\s*,\s*(?=[^,\s])/).map(p => p.trim()).filter(Boolean);

        for (const part of commaParts) {
          const words = part.split(/\s+/).filter(Boolean);
          if (words.length <= 5) {
            lines.push(words.join(' '));
          } else {
            // 5-WORD LIMIT: wrap into balanced chunks of ≤5 words
            lines.push(...chunkText(words));
          }
        }
        return lines;
      };

      // Build ONE slide from a pair (1–2) of raw lyric lines.
      const pairToSlide = (tag, pair) => {
        const formattedLines = [];
        pair.forEach(raw => {
          const formatted = formatLine(raw);
          if (formatted.length > 0) formattedLines.push(...formatted);
        });
        if (formattedLines.length === 0) return null;
        const content = formattedLines.join('\n');
        return {
          id: `${itemId}-slide-${slides.length}`,
          itemId,
          tag,
          content,
          wordCount: content.split(/\s+/).filter(Boolean).length
        };
      };

      const flushPairs = (tag) => {
        const remaining = currentSectionPlainLines;
        if (remaining.length === 0) return;
        // Group every 2 consecutive lines into ONE slide unit
        for (let i = 0; i < remaining.length; i += 2) {
          const slide = pairToSlide(tag, remaining.slice(i, i + 2));
          if (slide) {
            slides.push(slide);
            currentSectionSlides.push(slide.content);
          }
        }
        currentSectionPlainLines = [];
      };

      const flushSection = () => {
        flushPairs(currentTag);
        if (currentSectionSlides.length > 0) {
          sectionsJson.push({ name: currentTag, slides: [...currentSectionSlides] });
        }
        currentSectionSlides = [];
      };

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      for (const line of lines) {
        // Section header — switch the section tag, do NOT emit a standalone slide
        const headerMatch = line.match(/^\[([^\]]+)\]\s*(.*)$/);
        if (headerMatch) {
          flushSection();
          currentTag = headerMatch[1].trim().toUpperCase() || 'VERSE 1';
          const rest = headerMatch[2].trim();
          if (rest) {
            // Inline text after a header joins the next pairing
            currentSectionPlainLines.push(rest);
          }
          continue;
        }
        currentSectionPlainLines.push(line);
      }
      flushSection();

      if (slides.length === 0) {
        slides.push({
          id: `${itemId}-slide-0`,
          itemId,
          tag: 'VERSE 1',
          content: 'NEW SONG',
          wordCount: 2
        });
        sectionsJson.push({ name: 'VERSE 1', slides: ['NEW SONG'] });
      }

      return { slides, sectionsJson };
    }

    // Remove common clutter copied from lyric websites while preserving song
    // sections and all Unicode text (including Tamil).
    function cleanPastedLyrics(rawText) {
      const seenAdjacent = { value: '' };
      return String(rawText || '')
        .replace(/\r\n?/g, '\n')
        .split('\n')
        .map(line => {
          const cleaned = line
            .replace(/^\s*\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*/g, '')
            .replace(/^\s*[-•]\s+/, '')
            .replace(/^\s*#{1,6}\s*/, '')
            .replace(/^\s*\*\*(.*?)\*\*\s*$/, '$1')
            .replace(/[ \t]+$/g, '');
          const plain = cleaned.trim().replace(/^\[(.*?)\]$/, '$1').replace(/\s*:\s*$/, '').trim();
          const section = plain.match(/^(intro(?:\s*\d+)?|opening(?:\s*\d+)?|verse\s*\d+|pre[\s-]?chorus(?:\s*\d+)?|chorus(?:\s*\d+)?|bridge(?:\s*\d+)?|interlude(?:\s*\d+)?|instrumental(?:\s*\d+)?|outro(?:\s*\d+)?|ending(?:\s*\d+)?|end(?:\s*\d+)?|tag(?:\s*\d+)?)$/i);
          if (!section) return cleaned;
          const normalized = section[1]
            .replace(/([a-zA-Z])(\d)/g, '$1 $2')
            .replace(/pre[\s-]?chorus/i, 'PRE-CHORUS')
            .toUpperCase();
          return `[${normalized}]`;
        })
        .filter(line => {
          const normalized = line.trim().toLowerCase();
          if (normalized && normalized === seenAdjacent.value) return false;
          if (normalized) seenAdjacent.value = normalized;
          return true;
        })
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    async function downloadSongText(title, groupName, rawText) {
      const cleanText = cleanPastedLyrics(rawText);
      const { sectionsJson } = parseLyricsToSlides('download', cleanText);
      const body = sectionsJson.map(section =>
        `[${section.name}]\n${section.slides.join('\n\n')}`
      ).join('\n\n');
      const safeTitle = (title || 'New Song').trim();
      const contents = [
        `Title: ${safeTitle}`,
        groupName?.trim() ? `Singer: ${groupName.trim()}` : '',
        '',
        body
      ].filter((line, index, arr) => line || index > 0 && arr[index - 1]).join('\n');
      const blob = new Blob(['\uFEFF' + contents], { type: 'text/plain;charset=utf-8' });
      const fileName = (safeTitle.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'song-lyrics') + '.txt';

      // Chrome/Edge: open Save As so the dated service folder can be chosen.
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: 'Notepad lyrics file', accept: { 'text/plain': ['.txt'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (err) {
          if (err?.name === 'AbortError') return false;
          console.warn('Save picker unavailable; using browser download instead.', err);
        }
      }

      // Other browsers: download normally and let the user move/save the file.
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    }

    // ============================================================
    //  GOOGLE SHEETS STORAGE & RETRIEVAL
    // ============================================================
    // POST a song (create or update) to the cloud library
    // Standardized payload: { id, title, singer, sections }
    async function postSongToSheets(song) {
      try {
        // Build sections array from the song's slides (grouped by tag)
        const sections = [];
        const map = {};
        (song.slides || []).forEach(s => {
          if (!map[s.tag]) {
            map[s.tag] = [];
            sections.push({ name: s.tag, slides: map[s.tag] });
          }
          map[s.tag].push(s.content);
        });

        const payload = {
          id: song.id || ('song-' + Date.now()),
          title: song.title || 'Untitled',
          singer: song.singer || song.groupName || 'CRC Team',
          sections // Array of objects: [{ name: "VERSE 1", slides: ["Slide 1 text", "Slide 2 text"] }]
        };

        await fetch(SHEETS_API_URL, {
          method: 'POST',
          mode: 'no-cors', // Google Apps Script Web App standard
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      } catch (e) {
        console.error('Sheets POST failed:', e);
        return false;
      }
    }

    // Normalize a raw cloud record into our song shape
    function normalizeCloudSong(raw) {
      if (!raw) return null;
      const song = { ...raw };
      if (!song.title && song.name) song.title = song.name;
      if (!song.groupName && song.singer) song.groupName = song.singer;
      if (!song.id) song.id = `cloud-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      // Parse sectionsJson string (if present) into song.sections
      let sections = song.sections;
      if (typeof sections === 'string') {
        try { sections = JSON.parse(sections); } catch (e) { sections = []; }
      }
      if (!Array.isArray(sections)) sections = [];

      // Build slides from sections: [{ name: "VERSE 1", slides: ["text1", "text2"] }]
      const slides = [];
      sections.forEach(sec => {
        const tag = (sec.name || 'VERSE 1').toUpperCase();
        (sec.slides || []).forEach(content => {
          slides.push({
            id: `${song.id}-slide-${slides.length}`,
            itemId: song.id,
            tag,
            content,
            wordCount: content.split(/\s+/).filter(Boolean).length
          });
        });
      });

      // Fallback: if no sections, try raw slides field
      if (slides.length === 0) {
        let rawSlides = song.slides;
        if (typeof rawSlides === 'string') {
          try { rawSlides = JSON.parse(rawSlides); } catch (e) { rawSlides = []; }
        }
        if (Array.isArray(rawSlides)) {
          rawSlides.forEach((s, i) => {
            const content = s.content || s.text || s.lyrics || '';
            slides.push({
              id: `${song.id}-slide-${i}`,
              itemId: song.id,
              tag: (s.tag || 'VERSE 1').toUpperCase(),
              content,
              wordCount: content.split(/\s+/).filter(Boolean).length
            });
          });
        }
      }

      song.slides = slides;
      song.sections = sections;
      song.preview = song.preview || song.slides[0]?.content || '';
      song.type = song.type || 'SONGS';
      return song;
    }

    // GET the full cloud library from Google Sheets
    async function fetchCloudLibrary() {
      try {
        const res = await fetch(`${SHEETS_API_URL}?action=read`);
        if (!res.ok) return [];
        const data = await res.json();
        let list = [];
        if (Array.isArray(data)) list = data;
        else if (data && Array.isArray(data.songs)) list = data.songs;
        else if (data && Array.isArray(data.data)) list = data.data;
        return list.map(normalizeCloudSong).filter(Boolean);
      } catch (e) {
        console.error('Sheets GET failed:', e);
        return [];
      }
    }

    // ============================================================
    //  IMAGE UPLOAD & COMPRESSION
    //  - Downscale/compress to max width 1280px via Canvas
    //  - Returns Base64 data URL
    // ============================================================
    function compressImageToBase64(file, maxWidth = 1280) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // POST an uploaded image to the Images Apps Script endpoint

    // GET stored images from the Images Apps Script endpoint
    async function fetchCloudImages() {
      try {
        const res = await fetch(`${IMAGE_SHEETS_API_URL}?action=read`);
        if (!res.ok) return [];
        const data = await res.json();
        let list = [];
        if (Array.isArray(data)) list = data;
        else if (data && Array.isArray(data.images)) list = data.images;
        else if (data && Array.isArray(data.data)) list = data.data;
        return list.map(img => ({
          id: img.id || ('img-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6)),
          title: img.title || img.name || 'Untitled Image',
          category: img.category || 'General',
          imageData: img.imageData || img.data || ''
        })).filter(img => img.imageData);
      } catch (e) {
        console.error('Image GET failed:', e);
        return [];
      }
    }

    // ============================================================
    //  LOCAL SERVICE FOLDER HELPERS
    // ============================================================
    const MEDIA_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'mp4', 'webm', 'mp3', 'wav', 'm4a', 'ogg', 'pdf', 'txt'];

    function getExtension(name) {
      return (name.split('.').pop() || '').toLowerCase();
    }

    function cleanFileTitle(name) {
      return name
        .replace(/\.[^.]+$/, '')
        .replace(/^\s*\d+[\s._-]*/, '')
        .replace(/[_-]+/g, ' ')
        .trim() || 'UNTITLED';
    }

    function parseSongText(fileName, rawText) {
      const lines = rawText.replace(/^\uFEFF/, '').split(/\r?\n/);
      let title = cleanFileTitle(fileName);
      let groupName = '';
      const lyricLines = [];
      let foundSection = false;
      let foundExplicitTitle = false;

      // Accept headings commonly produced by Notepad song sheets, Gemini,
      // ChatGPT, and Markdown—not only the original [Verse 1] format.
      const sectionName = line => {
        const cleaned = line.trim()
          .replace(/^#{1,6}\s*/, '')
          .replace(/^[-*•]\s*/, '')
          .replace(/^\*\*(.*?)\*\*$/, '$1')
          .replace(/^\[(.*?)\]$/, '$1')
          .replace(/\s*:\s*$/, '')
          .trim();
        const match = cleaned.match(/^(intro(?:\s*\d+)?|opening(?:\s*\d+)?|verse\s*\d+|pre[\s-]?chorus(?:\s*\d+)?|chorus(?:\s*\d+)?|bridge(?:\s*\d+)?|interlude(?:\s*\d+)?|instrumental(?:\s*\d+)?|outro(?:\s*\d+)?|ending(?:\s*\d+)?|end(?:\s*\d+)?|tag(?:\s*\d+)?)$/i);
        if (!match) return '';
        return match[1]
          .replace(/([a-zA-Z])(\d)/g, '$1 $2')
          .replace(/pre[\s-]?chorus/i, 'PRE-CHORUS')
          .toUpperCase();
      };

      lines.forEach((line, index) => {
        const plain = line.trim().replace(/^#{1,6}\s*/, '').replace(/^\*\*(.*?)\*\*$/, '$1').trim();
        const titleMatch = plain.match(/^title\s*:\s*(.+)$/i);
        const singerMatch = plain.match(/^(?:singer|group|artist|worship(?:\s+team)?)\s*:\s*(.+)$/i);
        const authorMatch = plain.match(/^(?:author|written\s+by|writer|composer|lyrics\s+by)\s*:\s*(.+)$/i);
        const section = sectionName(line);

        if (titleMatch) {
          title = titleMatch[1].trim();
          foundExplicitTitle = true;
        } else if (singerMatch) {
          groupName = singerMatch[1].trim();
        } else if (authorMatch) {
          // Preserve useful credit in the singer/author field without putting
          // it into a lyric slide.
          if (!groupName) groupName = authorMatch[1].trim();
        } else if (section) {
          lyricLines.push(`[${section}]`);
          foundSection = true;
        } else if (!foundSection && plain) {
          const nextMeaningful = lines.slice(index + 1).map(v => v.trim()).find(Boolean) || '';
          const resemblesFileTitle = plain.toLowerCase() === cleanFileTitle(fileName).toLowerCase();
          const followedByMetadataOrSection = /^(?:title|singer|group|artist|author|written\s+by|writer|composer|lyrics\s+by)\s*:/i.test(nextMeaningful) || !!sectionName(nextMeaningful);
          if (!foundExplicitTitle && (resemblesFileTitle || followedByMetadataOrSection)) {
            title = plain;
            foundExplicitTitle = true;
          } else {
            lyricLines.push(line);
          }
        } else {
          lyricLines.push(line);
        }
      });
      const id = `local-song-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const { slides } = parseLyricsToSlides(id, lyricLines.join('\n'));
      return { id, type: 'SONGS', title: title.toUpperCase(), groupName, slides, preview: slides[0]?.content || '' };
    }

    async function renderPdfToSlides(file) {
      // PDF.js module is loaded lazily because the rest of the console should
      // continue to work if its CDN is temporarily unavailable.
      const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
      const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      const pages = [];
      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const initial = page.getViewport({ scale: 1 });
        const scale = Math.min(1920 / initial.width, 1080 / initial.height, 2);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        pages.push({ imageData: canvas.toDataURL('image/jpeg', 0.9), pageNumber });
      }
      return pages;
    }

    // ============================================================
    //  PROJECTOR SCREEN (dual-screen output) — WHITE HUD
    // ============================================================
    // Responsive slide font size — scales down as the line count and
    // longest line grow so multi-line slides stay readable and never
    // overflow the projector screen.
    const getSlideFontSize = (content) => {
      const text = content ? String(content) : '';
      if (!text.trim()) return 'clamp(1.5rem, 5vw, 7rem)';
      const lines = text.split('\n').map(l => l.trim());
      const lineCount = Math.max(lines.length, 1);
      const maxLineLen = Math.max(...lines.map(l => l.length), 1);

      // Width constraint: ~82vw usable width; heavy caps glyph ≈ 0.62em
      const byWidthVw = 82 / (maxLineLen * 0.62);
      // Height constraint: ~66vh usable height; line-height 1.4; 16:9 vh→vw
      const byHeightVw = (66 / (lineCount * 1.4)) * 0.5625;

      const targetVw = Math.min(byWidthVw, byHeightVw, 8);
      return `clamp(1.5rem, ${Math.max(targetVw, 2.2).toFixed(2)}vw, 7rem)`;
    };
    function ProjectorStage() {
      const [display, setDisplay] = useState({ type: 'SLIDE', title: 'CRC CHURCH WORSHIP', content: 'GREETINGS', songTitle: '', groupName: '' });
      const [transition, setTransition] = useState('fade');
      const projectorMediaUrlRef = useRef('');
      // animationKey forces the CSS animation to restart on every content change
      const [animationKey, setAnimationKey] = useState(0);

      // Hydrate from saved last state
      useEffect(() => {
        try {
          const saved = localStorage.getItem('worship_console_last_slide');
          if (saved) {
            const s = JSON.parse(saved);
            setDisplay(s.type ? s : { ...s, type: s.imageData ? 'IMAGE' : 'SLIDE' });
          }
          const savedT = localStorage.getItem('worship_console_transition');
          if (savedT) setTransition(savedT);
        } catch (e) {}

        // BroadcastChannel — realtime sync from control console
        const channel = new BroadcastChannel('worship-console-sync');
        const handleMessage = (e) => {
          if (!e.data) return;
          if (e.data.type === 'DISPLAY_CHANGE') {
            applyContent(e.data.payload);
            // Blob URLs are session-only, so do not persist them across reloads.
            if (!String(e.data.payload?.src || '').startsWith('blob:')) {
              try { localStorage.setItem('worship_console_last_slide', JSON.stringify(e.data.payload)); } catch (err) {}
            }
          } else if (e.data.type === 'SLIDE_CHANGE') {
            applyContent({ ...e.data.slide, type: 'SLIDE' });
          } else if (e.data.type === 'IMAGE_CHANGE') {
            applyContent({ ...e.data.payload, type: 'IMAGE', src: e.data.payload.imageData });
          } else if (e.data.type === 'TRANSITION_CHANGE') {
            setTransition(e.data.transition);
            try { localStorage.setItem('worship_console_transition', e.data.transition); } catch (err) {}
          }
        };
        channel.onmessage = handleMessage;
        // postMessage is also used because file:// pages do not consistently
        // share a BroadcastChannel storage key across separate windows.
        window.addEventListener('message', handleMessage);
        return () => {
          channel.close();
          window.removeEventListener('message', handleMessage);
          if (projectorMediaUrlRef.current) URL.revokeObjectURL(projectorMediaUrlRef.current);
        };
      }, []);

      // Apply an animation class based on the current transition + restart animation
      const transitionClass = `trans-${transition || 'fade'}`;

      // Fade out, swap content, apply transition animation (300ms–500ms)
      const applyContent = (data) => {
        setAnimationKey(k => k + 1);
        if (projectorMediaUrlRef.current) {
          URL.revokeObjectURL(projectorMediaUrlRef.current);
          projectorMediaUrlRef.current = '';
        }
        if (data?.blob) {
          projectorMediaUrlRef.current = URL.createObjectURL(data.blob);
          setDisplay({ ...data, src: projectorMediaUrlRef.current });
        } else {
          setDisplay(data || { type: 'SLIDE', content: '' });
        }
      };

      return (
        <div className="w-screen h-screen bg-white flex flex-col select-none overflow-hidden no-scrollbar relative">
          {/* Main content — large high-contrast black text centered OR full image */}
          {display.type === 'IMAGE' || display.type === 'PDF' ? (
            <div className="flex-1 relative overflow-hidden">
              <img
                key={animationKey}
                src={display.src || display.imageData}
                alt={display.title || 'Image'}
                className={`absolute inset-0 w-full h-full object-contain ${transitionClass}`}
              />
            </div>
          ) : display.type === 'VIDEO' ? (
            <video key={`${animationKey}-${display.src}`} src={display.src} autoPlay playsInline loop={!!display.loop} controls className={`absolute inset-0 w-full h-full object-contain bg-black ${transitionClass}`} />
          ) : display.type === 'AUDIO' ? (
            <div className="flex-1 bg-black flex flex-col items-center justify-center text-white">
              <div className="text-7xl mb-6">♫</div>
              <div className="text-3xl font-black tracking-wide uppercase">{display.title}</div>
              <audio key={`${animationKey}-${display.src}`} src={display.src} autoPlay loop={!!display.loop} />
            </div>
          ) : display.type === 'BIBLE' ? (
            <div className="flex-1 flex flex-col justify-center items-center px-[7vw] text-center overflow-hidden bg-white">
              <div key={animationKey} className={`w-full ${transitionClass}`}>
                <p className="font-bold leading-[1.35] text-slate-900" style={{fontSize:'clamp(1.5rem, 3.2vw, 4.6rem)'}}>{display.english}</p>
                <div className="w-28 h-1 bg-indigo-500 mx-auto my-[3vh] rounded-full"></div>
                <p lang="ta" className="font-bold leading-[1.45] text-black" style={{fontSize:'clamp(1.6rem, 3.45vw, 5rem)'}}>{display.tamil}</p>
              </div>
            </div>
          ) : (
            <div className="flex-1 flex flex-col justify-center items-center px-12 text-center overflow-hidden">
              <p
                key={animationKey}
                className={`font-black tracking-wide leading-[1.4] whitespace-pre-wrap text-black uppercase w-full ${transitionClass}`}
                style={{ fontSize: getSlideFontSize(display?.content) }}
              >
                {display?.content}
              </p>
            </div>
          )}

          {/* HUD Footer — clean, minimal, small subtle black text */}
          <div className="absolute bottom-0 inset-x-0 px-8 py-4 flex justify-between items-end select-none">
            <span className="text-xs md:text-sm font-medium text-black/60 uppercase tracking-wide">
              {display?.songTitle || display?.title || ''}
            </span>
            <span className="text-xs md:text-sm font-medium text-black/60 uppercase tracking-wide">
              CRC Coimbatore
            </span>
            <span className="text-xs md:text-sm font-medium text-black/60 uppercase tracking-wide">
              {display?.groupName || ''}
            </span>
          </div>
        </div>
      );
    }

    // ============================================================
    //  MAIN CONTROL CONSOLE
    // ============================================================
    function PresenterConsole() {
      // ⚠️ EMPTY INITIAL STATE — no dummy data, no pre-loaded slides
      const [serviceQueue, setServiceQueue] = useState([]);
      const [cloudLibrary, setCloudLibrary] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeItemId, setActiveItemId] = useState('');
      // Composite selection state — uniquely identifies ONE slide card:
      // activeSectionIdx = index of the section group (VERSE 1, CHORUS, ...)
      // activeSlideIdx   = index of the slide WITHIN that section group
      const [activeSectionIdx, setActiveSectionIdx] = useState(0);
      const [activeSlideIdx, setActiveSlideIdx] = useState(0);
      const [pasteOpen, setPasteOpen] = useState(false);
      const [bibleOpen, setBibleOpen] = useState(false);
      const [bibleData, setBibleData] = useState({ english: null, tamil: null });
      const [bibleStatus, setBibleStatus] = useState('not-loaded');
      const [proWindowOpen, setProWindowOpen] = useState(false);
      const proWindowRef = useRef(null);
      const [liveDisplay, setLiveDisplay] = useState(null);
      const [liveSlideId, setLiveSlideId] = useState('');
      const [cloudStatus, setCloudStatus] = useState('loading');
      const [saveStatus, setSaveStatus] = useState('');
      const [cloudImages, setCloudImages] = useState([]);
      const [imageStatus, setImageStatus] = useState('loading');
      const [imageUploading, setImageUploading] = useState(false);
      const [transition, setTransition] = useState('fade');
      const [localServices, setLocalServices] = useState([]);
      const [selectedServiceDate, setSelectedServiceDate] = useState('');
      const [localFolderStatus, setLocalFolderStatus] = useState('');
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const bibleFolderInputRef = useRef(null);

      // GitHub Pages can load the bundled JSON directly. Local file:// mode
      // uses the folder picker below because browsers block local fetches.
      useEffect(() => {
        if (window.location.protocol === 'file:') return;
        Promise.all([
          fetch('bible/data/english.json').then(r => { if (!r.ok) throw new Error('English Bible unavailable'); return r.json(); }),
          fetch('bible/data/tamil.json').then(r => { if (!r.ok) throw new Error('Tamil Bible unavailable'); return r.json(); })
        ]).then(([english, tamil]) => {
          setBibleData({ english, tamil });
          setBibleStatus('ready');
        }).catch(() => setBibleStatus('not-loaded'));
      }, []);

      const handleBibleFolder = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        const englishFile = files.find(f => f.name.toLowerCase() === 'english.json');
        const tamilFile = files.find(f => f.name.toLowerCase() === 'tamil.json');
        if (!englishFile || !tamilFile) {
          setBibleStatus('error');
          alert('Please select the bible folder containing data/english.json and data/tamil.json.');
          return;
        }
        setBibleStatus('loading');
        try {
          const [english, tamil] = await Promise.all([englishFile.text().then(JSON.parse), tamilFile.text().then(JSON.parse)]);
          setBibleData({ english, tamil });
          setBibleStatus('ready');
          setBibleOpen(true);
        } catch (err) {
          console.error('Bible folder could not be read:', err);
          setBibleStatus('error');
          alert('The Bible JSON files could not be read. Please select the generated bible folder again.');
        }
      };

      // Fetch cloud library from Google Sheets on mount
      const refreshCloud = useCallback(() => {
        setCloudStatus('loading');
        fetchCloudLibrary().then(songs => {
          setCloudLibrary(songs);
          setCloudStatus('ready');
        }).catch(() => {
          setCloudStatus('error');
        });
      }, []);

      useEffect(() => {
        refreshCloud();
      }, [refreshCloud]);

      // Fetch cloud images from the Images Apps Script endpoint on mount
      useEffect(() => {
        setImageStatus('loading');
        fetchCloudImages().then(images => {
          setCloudImages(images);
          setImageStatus('ready');
        }).catch(() => {
          setImageStatus('error');
        });
      }, []);

      // Active item from the service queue
      const activeItem = serviceQueue.find(i => i.id === activeItemId) || null;

      // Preserve the pasted section sequence. Only adjacent slides with the
      // exact same label belong to one section. A later CHORUS, CHORUS 1,
      // INTRO 1, etc. remains a separate occurrence instead of being merged
      // back into an earlier group.
      const groupedSlides = useMemo(() => {
        const groups = [];
        (activeItem?.slides || []).forEach((s, flatIdx) => {
          const previousGroup = groups[groups.length - 1];
          if (!previousGroup || previousGroup.tag !== s.tag) {
            groups.push({ tag: s.tag, slides: [] });
          }
          groups[groups.length - 1].slides.push({ ...s, flatIdx });
        });
        return groups;
      }, [activeItem]);

      // Reset selection whenever the active item changes
      useEffect(() => {
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
      }, [activeItemId]);

      // The currently selected slide — resolved from composite state.
      const currentSlide = groupedSlides[activeSectionIdx]?.slides[activeSlideIdx] || null;

      // Flat index of the current slide within the active item (for nav).
      const currentFlatIdx = currentSlide ? currentSlide.flatIdx : 0;

      const currentDisplayTitle = currentSlide && activeItem
        ? `${activeItem.title} (${currentSlide.tag})`.toUpperCase()
        : '';

      // Convert a flat index back into section+slide composite state.
      const setSelectionFromFlat = useCallback((flatIdx) => {
        for (let si = 0; si < groupedSlides.length; si++) {
          const gi = groupedSlides[si].slides.findIndex(s => s.flatIdx === flatIdx);
          if (gi !== -1) {
            setActiveSectionIdx(si);
            setActiveSlideIdx(gi);
            return;
          }
        }
      }, [groupedSlides]);

      // Send only an explicit GO LIVE action to the projector. Selecting/editing
      // a card no longer changes what the congregation sees.
      const broadcastDisplay = useCallback((payload, slideId = '') => {
        const channel = new BroadcastChannel('worship-console-sync');
        channel.postMessage({ type: 'DISPLAY_CHANGE', payload });
        channel.close();
        if (proWindowRef.current && !proWindowRef.current.closed) {
          proWindowRef.current.postMessage({ type: 'DISPLAY_CHANGE', payload }, '*');
        }
        setLiveDisplay(payload);
        setLiveSlideId(slideId);
        if (!String(payload.src || '').startsWith('blob:')) {
          try { localStorage.setItem('worship_console_last_slide', JSON.stringify(payload)); } catch (e) {}
        }
      }, []);

      const goLive = useCallback((item = activeItem, slide = currentSlide) => {
        if (!item) return;
        if (item.type === 'IMAGE' || item.type === 'PDF') {
          broadcastDisplay({ type: item.type, src: item.src || item.imageData, title: item.title || '' });
          return;
        }
        if (item.type === 'VIDEO' || item.type === 'AUDIO') {
          broadcastDisplay({ type: item.type, src: item.src, blob: item.blob || null, title: item.title || '', loop: !!item.loop });
          return;
        }
        if (!slide) return;
        broadcastDisplay({
          type: 'SLIDE',
          title: `${item.title} (${slide.tag})`.toUpperCase(),
          content: slide.content || '',
          tag: slide.tag || '',
          songTitle: item.title || '',
          groupName: item.groupName || ''
        }, slide.id);
      }, [activeItem, currentSlide, broadcastDisplay]);

      // Broadcast the selected transition to the display window + persist.
      useEffect(() => {
        const channel = new BroadcastChannel('worship-console-sync');
        channel.postMessage({ type: 'TRANSITION_CHANGE', transition });
        channel.close();
        if (proWindowRef.current && !proWindowRef.current.closed) {
          proWindowRef.current.postMessage({ type: 'TRANSITION_CHANGE', transition }, '*');
        }
        try { localStorage.setItem('worship_console_transition', transition); } catch (e) {}
      }, [transition]);

      // Keyboard navigation — single-key hotkeys (no Ctrl/Alt modifiers).
      // Left Arrow -> Previous, Right Arrow -> Next.
      // Ignored while typing in an input or textarea.
      useEffect(() => {
        const handler = (e) => {
          if (e.ctrlKey || e.altKey || e.metaKey) return;
          if (pasteOpen) return;
          const t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
          if (!activeItem || activeItem.slides.length === 0) return;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            const nextIdx = e.key === 'ArrowRight'
              ? Math.min(currentFlatIdx + 1, activeItem.slides.length - 1)
              : Math.max(currentFlatIdx - 1, 0);
            const slide = activeItem.slides[nextIdx];
            setSelectionFromFlat(nextIdx);
            goLive(activeItem, slide);
            return;
          }
          const key = e.key.toUpperCase();
          let wantedTag = '';
          if (/^[1-9]$/.test(key)) wantedTag = `VERSE ${key}`;
          else if (key === 'C') wantedTag = 'CHORUS';
          else if (key === 'B') wantedTag = 'BRIDGE';
          else if (key === 'I') wantedTag = 'INTRO';
          else if (key === 'O') wantedTag = 'OUTRO';
          else if (key === 'P') wantedTag = 'PRE-CHORUS';
          if (!wantedTag) return;
          const idx = activeItem.slides.findIndex(s => {
            const normalizeTag = value => String(value || '').toUpperCase().replace(/[-_]+/g, ' ').replace(/([A-Z])(\d)/g, '$1 $2').replace(/\s+/g, ' ').trim();
            const tag = normalizeTag(s.tag);
            const wanted = normalizeTag(wantedTag);
            return ['CHORUS', 'BRIDGE', 'INTRO', 'OUTRO', 'PRE CHORUS'].includes(wanted)
              ? tag.startsWith(wanted)
              : tag === wanted;
          });
          if (idx !== -1) {
            e.preventDefault();
            setSelectionFromFlat(idx);
            goLive(activeItem, activeItem.slides[idx]);
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [pasteOpen, currentFlatIdx, activeItem, setSelectionFromFlat, goLive]);

      // Detect if popout window closes
      useEffect(() => {
        const check = setInterval(() => {
          setProWindowOpen(!!proWindowRef.current && !proWindowRef.current.closed);
        }, 2000);
        return () => clearInterval(check);
      }, []);

      const openProfessionalWindow = () => {
        // Works both on GitHub Pages and when opening the local draft via file://.
        const url = window.location.href.split('?')[0].split('#')[0] + '?mode=projector';
        const w = window.open(url, 'ProjectorScreen', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
        proWindowRef.current = w;
        setProWindowOpen(!!w);
      };

      // Filtered cloud library based on sidebar search query (songs)
      const filteredCloud = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return cloudLibrary;
        return cloudLibrary.filter(s =>
          (s.title || '').toLowerCase().includes(q) ||
          (s.groupName || '').toLowerCase().includes(q)
        );
      }, [cloudLibrary, searchQuery]);

      // Filtered cloud images (search by title / category)
      const filteredImages = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return cloudImages;
        return cloudImages.filter(img =>
          (img.title || '').toLowerCase().includes(q) ||
          (img.category || '').toLowerCase().includes(q)
        );
      }, [cloudImages, searchQuery]);

      // Handle image file selection: compress + upload to cloud + add to queue
      const handleImageFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!/image\/(jpeg|png)/.test(file.type)) {
          alert('Please select a .jpg or .png image file.');
          return;
        }
        setImageUploading(true);
        try {
          const base64 = await compressImageToBase64(file);
          const filename = (file.name || 'image').replace(/\.(jpg|jpeg|png)$/i, '');
          const title = (prompt('Image Title (optional):', filename) || filename).trim();
          const category = (prompt('Category (default: General):', 'General') || 'General').trim();
          const payload = { id: 'img-' + Date.now(), title, category, imageData: base64 };
          await postImageToSheets(payload);
          const imgObj = { id: payload.id, title, category, imageData: base64 };
          setCloudImages(prev => [...prev, imgObj]);
          addImageToQueue(imgObj);
        } catch (err) {
          console.error('Image upload failed:', err);
          alert('Image upload failed. Please try again.');
        } finally {
          setImageUploading(false);
        }
      };

      // Import a root folder whose immediate subfolders are service dates.
      // Files stay local; the browser receives temporary read-only access.
      const handleServiceFolder = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        setLocalFolderStatus('loading');
        const grouped = {};
        let skipped = 0;
        for (const file of files) {
          const parts = (file.webkitRelativePath || file.name).split('/');
          const date = parts.length > 2 ? parts[1] : 'Undated';
          const ext = getExtension(file.name);
          if (!MEDIA_EXTENSIONS.includes(ext)) { skipped++; continue; }
          if (!grouped[date]) grouped[date] = [];
          try {
            if (ext === 'txt') {
              grouped[date].push(parseSongText(file.name, await file.text()));
            } else if (ext === 'pdf') {
              const pages = await renderPdfToSlides(file);
              pages.forEach(page => grouped[date].push({
                id: `local-pdf-${Date.now()}-${page.pageNumber}-${Math.random().toString(36).slice(2, 6)}`,
                type: 'PDF',
                title: `${cleanFileTitle(file.name)} · PAGE ${page.pageNumber}`,
                src: page.imageData,
                slides: [],
                preview: `PDF page ${page.pageNumber}`,
                sourceName: file.name
              }));
            } else {
              const type = ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)
                ? 'IMAGE'
                : ['mp4', 'webm'].includes(ext) ? 'VIDEO' : 'AUDIO';
              grouped[date].push({
                id: `local-${type.toLowerCase()}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                type,
                title: cleanFileTitle(file.name).toUpperCase(),
                src: URL.createObjectURL(file),
                blob: file,
                slides: [],
                loop: type === 'VIDEO' || type === 'AUDIO',
                preview: file.name,
                sourceName: file.name
              });
            }
          } catch (err) {
            console.error(`Could not import ${file.name}:`, err);
            skipped++;
          }
        }
        const services = Object.entries(grouped)
          .map(([date, items]) => ({ date, items: items.sort((a, b) => (a.sourceName || a.title).localeCompare(b.sourceName || b.title, undefined, { numeric: true })) }))
          .sort((a, b) => b.date.localeCompare(a.date, undefined, { numeric: true }));
        setLocalServices(services);
        const today = new Date().toISOString().slice(0, 10);
        const initial = services.find(s => s.date === today) || services[0];
        if (initial) loadLocalService(initial);
        setLocalFolderStatus(skipped ? `Ready · ${skipped} unsupported/failed file${skipped === 1 ? '' : 's'}` : 'Ready');
      };

      const loadLocalService = (service) => {
        setSelectedServiceDate(service.date);
        setServiceQueue(service.items);
        setActiveItemId(service.items[0]?.id || '');
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
      };

      const toggleMediaLoop = (id) => {
        setServiceQueue(prev => prev.map(item => item.id === id ? { ...item, loop: !item.loop } : item));
      };

      // Push an image into today's active Service Items queue
      const addImageToQueue = (img) => {
        const newId = `imgqueue-${Date.now()}`;
        const queued = {
          id: newId,
          type: 'IMAGE',
          title: img.title || 'Untitled Image',
          imageData: img.imageData,
          slides: []
        };
        setServiceQueue(prev => [...prev, queued]);
        setActiveItemId(newId);
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
      };

      // Add a cloud song into today's service queue
      const addToQueue = (song) => {
        const newId = `queue-${Date.now()}`;
        const queued = {
          ...song,
          id: newId,
          type: song.type || 'SONGS',
          slides: (song.slides || []).map((s, i) => ({
            ...s,
            id: `${newId}-slide-${i}`,
            itemId: newId
          }))
        };
        setServiceQueue(prev => [...prev, queued]);
        setActiveItemId(newId);
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
      };

      // Add a new song from pasted lyrics — auto-split + POST to Sheets
      const addSongFromLyrics = async (title, rawText, groupName) => {
        const newId = `cat-${Date.now()}`;
        const { slides, sectionsJson } = parseLyricsToSlides(newId, rawText);
        // Fallback: if title blank, use first line of lyrics as title
        const fallbackTitle = rawText.split('\n').map(l => l.trim()).find(l => l.length > 0) || 'NEW SONG';
        const finalTitle = (title || fallbackTitle).toUpperCase();
        const newSong = {
          id: newId,
          type: 'SONGS',
          title: finalTitle,
          groupName: groupName || '',
          preview: slides[0]?.content || '',
          slides,
          sectionsJson
        };
        setServiceQueue(prev => [...prev, newSong]);
        setActiveItemId(newId);
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
        setPasteOpen(false);
        // POST to Google Sheets cloud library (fire-and-forget)
        postSongToSheets(newSong);
      };

      // Add a blank info / announcement item to the queue
      const addInfoItem = () => {
        const newId = `info-${Date.now()}`;
        const newItem = {
          id: newId,
          type: 'ANNOUNCEMENTS',
          title: 'NEW INFO',
          groupName: '',
          preview: 'CLICK TO EDIT',

            id: `${newId}-slide-0`,
            itemId: newId,
            tag: 'INFO',
            content: 'NEW INFO',
            wordCount: 2

        setActiveItemId(newId);
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);

        setServiceQueue(prev => {
          const next = prev.filter(i => i.id !== id);
          if (activeItemId === id) {

            setActiveSlideIdx(0);

        setServiceQueue(prev => prev.map(i => i.id === id ? { ...i, [field]: value } : i));

      // Update a slide's content (manual editing on the grid)
      const updateSlideContent = (slideId, content) => {
        if (!activeItem) return;
        const words = content.split(/\s+/).filter(Boolean).length;
        setServiceQueue(prev => prev.map(i => {
          if (i.id !== activeItem.id) return i;
          const slides = i.slides.map(s => s.id === slideId ? { ...s, content, wordCount: words } : s);
          return { ...i, slides, preview: slides[0]?.content || i.preview };
        }));
      };

      // Delete a slide from the active item
      const deleteSlide = (slideId) => {
        if (!activeItem) return;
        setServiceQueue(prev => prev.map(i => {
          if (i.id !== activeItem.id) return i;
          const slides = i.slides.filter(s => s.id !== slideId);
          return { ...i, slides, preview: slides[0]?.content || i.preview };
        }));
        setActiveSectionIdx(0);
        setActiveSlideIdx(0);
      };

      // Add a blank slide under a section header
      const addSlideToSection = (tag) => {
        if (!activeItem) return;
        setServiceQueue(prev => prev.map(i => {
          if (i.id !== activeItem.id) return i;
          const nid = `${i.id}-slide-${Date.now()}`;
          const newSlide = { id: nid, itemId: i.id, tag: tag || 'VERSE 1', content: '', wordCount: 0 };
          return { ...i, slides: [...i.slides, newSlide] };
        }));
      };

      // Save all manual edits + structural changes back to Google Sheets
      const saveEditsToCloud = async () => {
        if (!activeItem) return;
        setSaveStatus('saving');
        // Rebuild sectionsJson from the current (edited) slides
        const sectionsJson = [];
        const map = {};
        activeItem.slides.forEach(s => {
          if (!map[s.tag]) {
            map[s.tag] = [];
            sectionsJson.push({ name: s.tag, slides: map[s.tag] });
          }
          map[s.tag].push(s.content);
        });
        const updatedSong = { ...activeItem, sectionsJson };
        const ok = await postSongToSheets(updatedSong);
        setSaveStatus(ok ? 'saved' : 'error');
        setTimeout(() => setSaveStatus(''), 2500);
      };

                      <div className="absolute inset-0 opacity-[0.05]" style={{backgroundImage:'radial-gradient(circle at 50% 50%, #6366F1 0%, transparent 70%)'}}></div>

                        <img src={liveDisplay.src || liveDisplay.imageData} className="absolute inset-0 w-full h-full object-contain" />

                          <p className="text-[9px] font-bold leading-snug text-slate-100 normal-case">{liveDisplay.english}</p>
                          <div className="h-px bg-indigo-400/60 my-2"></div>

                              {liveDisplay.title}

                    <button
                      onClick={() => goLive()}
                      disabled={!activeItem || (!currentSlide && !['IMAGE', 'VIDEO', 'AUDIO', 'PDF'].includes(activeItem.type))}
                      className="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-30 text-white text-xs font-black tracking-[0.18em]"
                    >● GO LIVE</button>
                    <div className="text-[9px] text-slate-500 text-center leading-relaxed">
                      Hotkeys: 1–9 Verses · C Chorus · B Bridge · P Pre-Chorus · I Intro · O Outro
                    </div>

                    {/* Prev / Next controls */}
                    <div className="flex gap-2">
                      <button
                        onClick={() => { const idx = Math.max(currentFlatIdx - 1, 0); setSelectionFromFlat(idx); goLive(activeItem, activeItem?.slides[idx]); }}
                        disabled={!activeItem || currentFlatIdx === 0}
                        className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 rounded-lg font-bold text-[11px] transition border border-slate-700"

                        ◀ PREVIOUS

                      <button
                        onClick={() => { const idx = Math.min(currentFlatIdx + 1, (activeItem?.slides.length || 1) - 1); setSelectionFromFlat(idx); goLive(activeItem, activeItem?.slides[idx]); }}
                        disabled={!activeItem || currentFlatIdx >= (activeItem?.slides.length || 1) - 1}
                        className="flex-1 py-2.5 rounded-lg font-bold text-[11px] transition text-white border disabled:opacity-30"
                        style={{ background: ACCENT, borderColor: ACCENT }}

                        NEXT ▶
                      </button>

                    {/* Transition Selection */}
                    <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3 space-y-2">
                      <div className="text-[9px] font-black tracking-[0.2em] text-slate-500 uppercase">Transition</div>
                      <select
                        value={transition}
                        onChange={(e) => setTransition(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-[11px] font-bold text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="none">None (Instant)</option>
                        <option value="fade">Fade / Crossfade (Default)</option>
                        <option value="fade-black">Fade to Black</option>
                        <option value="slide-left">Slide Left</option>
                        <option value="slide-right">Slide Right</option>
                        <option value="slide-up">Slide Up</option>

                  {/* Professional window launcher at bottom of col 4 */}
                  <div className="p-4 border-t border-slate-800">
                    <button
                      onClick={openProfessionalWindow}
                      className="w-full py-2.5 rounded-lg text-[10px] font-black tracking-widest uppercase text-white transition flex items-center justify-center space-x-2"
                      style={{ background: ACCENT, boxShadow: `0 4px 20px ${ACCENT}40` }}
                    >
                      <span>🖥️</span>
                      <span>Open Professional Window</span>
                    </button>
                  </div>
                </div>
              </div>
            </main>
          </div>

          {/* ==================== HIDDEN FILE INPUT + PASTE MODAL ==================== */}
          <input
            ref={fileInputRef}
            type="file"
            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            onChange={handleImageFile}
            className="hidden"
          />
          <input
            ref={folderInputRef}
            type="file"
            webkitdirectory=""
            directory=""
            multiple
            accept=".txt,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mp3,.wav,.m4a,.ogg,.pdf"
            onChange={handleServiceFolder}
            className="hidden"
          />
          <input
            ref={bibleFolderInputRef}
            type="file"
            webkitdirectory=""
            directory=""
            multiple
            accept=".json,application/json"
            onChange={handleBibleFolder}
            className="hidden"
          />
          {bibleOpen && (
            <BibleModal
              bibleData={bibleData}
              status={bibleStatus}
              onConnect={() => bibleFolderInputRef.current && bibleFolderInputRef.current.click()}
              onClose={() => setBibleOpen(false)}
              onGoLive={(payload) => broadcastDisplay(payload, '')}
            />
          )}
          {pasteOpen && (
            <PasteLyricsModal
              onClose={() => setPasteOpen(false)}

            />

        </div>
      );
    }

    // ============================================================
    //  LOCAL BILINGUAL BIBLE MODAL
    // ============================================================
    function BibleModal({ bibleData, status, onConnect, onClose, onGoLive }) {
      const [book, setBook] = useState('JHN');
      const [chapter, setChapter] = useState(3);
      const [verseStart, setVerseStart] = useState(16);
      const [verseEnd, setVerseEnd] = useState(16);
      const [passageMode, setPassageMode] = useState(false);
      const [waitingForEnd, setWaitingForEnd] = useState(false);
      const [currentVerse, setCurrentVerse] = useState(16);
      const [query, setQuery] = useState('');

      const allKeys = useMemo(() => {
        const keys = new Set([
          ...Object.keys(bibleData.english || {}),
          ...Object.keys(bibleData.tamil || {})
        ]);
        return Array.from(keys);
      }, [bibleData]);

      const chapters = useMemo(() => {
        const values = allKeys.filter(k => k.startsWith(`${book}.`)).map(k => Number(k.split('.')[1])).filter(Number.isFinite);
        return [...new Set(values)].sort((a,b) => a-b);
      }, [allKeys, book]);

      const verses = useMemo(() => {
        const prefix = `${book}.${chapter}.`;
        const values = allKeys.filter(k => k.startsWith(prefix)).flatMap(k => {
          const raw = k.slice(prefix.length);
          const match = raw.match(/^(\d+)(?:-(\d+))?/);
          if (!match) return [];
          const start = Number(match[1]);
          const end = Number(match[2] || match[1]);
          return Array.from({length: end - start + 1}, (_, index) => start + index);
        }).filter(Number.isFinite);
        return [...new Set(values)].sort((a,b) => a-b);
      }, [allKeys, book, chapter]);

      useEffect(() => {
        if (chapters.length && !chapters.includes(chapter)) setChapter(chapters[0]);
      }, [book, chapters]);

      useEffect(() => {
        if (verses.length && !verses.includes(verseStart)) {
          setVerseStart(verses[0]);
          setVerseEnd(verses[0]);
          setCurrentVerse(verses[0]);
        }
      }, [book, chapter, verses]);

      const lookupVerse = (data, verse) => {
        const direct = data?.[`${book}.${chapter}.${verse}`];
        if (direct) return direct;
        const rangedKey = Object.keys(data || {}).find(k => {
          const match = k.match(new RegExp(`^${book}\\.${chapter}\\.(\\d+)-(\\d+)$`));
          return match && verse >= Number(match[1]) && verse <= Number(match[2]);
        });
        return rangedKey ? data[rangedKey] : '';
      };
      const passageVerses = verses.filter(v => v >= verseStart && v <= verseEnd);
      const english = lookupVerse(bibleData.english, currentVerse);
      const tamil = lookupVerse(bibleData.tamil, currentVerse);
      const reference = `${BIBLE_BOOK_NAME[book]} ${chapter}:${currentVerse}`;
      const passageReference = `${BIBLE_BOOK_NAME[book]} ${chapter}:${verseStart}${verseEnd > verseStart ? `–${verseEnd}` : ''}`;

      const filteredBooks = BIBLE_BOOKS.filter(([code, name]) => `${code} ${name}`.toLowerCase().includes(query.trim().toLowerCase()));
      const chooseBook = (code) => {
        setBook(code);
        setChapter(1);
        setVerseStart(1);
        setVerseEnd(1);
        setCurrentVerse(1);
        setWaitingForEnd(false);
      };
      const selectVerse = (verse) => {
        if (!passageMode) {
          setVerseStart(verse);
          setVerseEnd(verse);
          setCurrentVerse(verse);
          return;
        }
        if (!waitingForEnd) {
          setVerseStart(verse);
          setVerseEnd(verse);
          setCurrentVerse(verse);
          setWaitingForEnd(true);
        } else {
          const start = Math.min(verseStart, verse);
          const end = Math.max(verseStart, verse);
          setVerseStart(start);
          setVerseEnd(end);
          setCurrentVerse(start);
          setWaitingForEnd(false);
        }
      };
      const setMode = (isPassage) => {
        setPassageMode(isPassage);
        setWaitingForEnd(false);
        if (!isPassage) {
          setVerseStart(currentVerse);
          setVerseEnd(currentVerse);
        }
      };
      const presentVerse = (verse = currentVerse) => {
        const englishText = lookupVerse(bibleData.english, verse);
        const tamilText = lookupVerse(bibleData.tamil, verse);
        if (!englishText && !tamilText) return;
        const verseReference = `${BIBLE_BOOK_NAME[book]} ${chapter}:${verse}`;
        setCurrentVerse(verse);
        onGoLive({ type:'BIBLE', title:verseReference, songTitle:verseReference, groupName:'WEBU · TAMIL OTCV', english:englishText, tamil:tamilText });
      };
      const movePassage = (direction) => {
        const index = passageVerses.indexOf(currentVerse);
        const nextIndex = Math.max(0, Math.min(index + direction, passageVerses.length - 1));
        if (passageVerses[nextIndex] != null) presentVerse(passageVerses[nextIndex]);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-5">
          <div className="w-full max-w-6xl h-[90vh] flex flex-col bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-5 py-3 border-b border-slate-800 flex justify-between items-center shrink-0">
              <div>
                <h2 className="text-sm font-black tracking-widest text-white uppercase">Bilingual Bible</h2>
                <p className="text-[10px] text-slate-500 mt-0.5">English WEBU + Tamil OTCV · local and offline</p>
              </div>
              <div className="flex items-center gap-2">
                <span className={`text-[9px] font-bold px-2 py-1 rounded ${status === 'ready' ? 'text-emerald-400 bg-emerald-500/10' : 'text-amber-300 bg-amber-500/10'}`}>{status === 'ready' ? '● BIBLE READY' : status === 'loading' ? 'READING…' : 'BIBLE NOT CONNECTED'}</span>
                <button onClick={onConnect} className="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-[10px] font-black text-white">📁 SELECT BIBLE FOLDER</button>
                <button onClick={onClose} className="px-2 text-slate-500 hover:text-white text-lg font-bold">✕</button>
              </div>
            </div>

            {status !== 'ready' ? (
              <div className="flex-1 flex flex-col items-center justify-center text-center p-8">
                <div className="text-6xl mb-4">📖</div>
                <div className="text-white font-black tracking-wide">Connect the generated Bible folder</div>
                <p className="text-xs text-slate-500 mt-2 max-w-lg">Select the project’s <span className="text-indigo-300">bible</span> folder. It must contain <span className="text-indigo-300">data/english.json</span> and <span className="text-indigo-300">data/tamil.json</span>.</p>
                <button onClick={onConnect} className="mt-5 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-black text-white">SELECT BIBLE FOLDER</button>
              </div>
            ) : (
              <div className="flex-1 flex min-h-0">
                <aside className="w-64 border-r border-slate-800 p-3 flex flex-col min-h-0">
                  <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search book…" className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  <div className="flex-1 overflow-y-auto mt-2 space-y-1">
                    {filteredBooks.map(([code,name]) => <button key={code} onClick={() => chooseBook(code)} className={`w-full text-left px-3 py-2 rounded-lg text-[11px] font-bold ${book === code ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>{name}</button>)}
                  </div>
                </aside>
                <main className="flex-1 p-5 overflow-y-auto">
                  <div>
                    <label className="text-[9px] font-black tracking-wider text-slate-500 uppercase">Book<select value={book} onChange={e => chooseBook(e.target.value)} className="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-xs text-white">{BIBLE_BOOKS.map(([code,name]) => <option key={code} value={code}>{name}</option>)}</select></label>
                  </div>
                  <div className="mt-4">
                    <div className="text-[9px] font-black tracking-wider text-slate-500 uppercase mb-2">Chapter</div>
                    <div className="flex flex-wrap gap-1.5">
                      {chapters.map(c => <button key={c} onClick={() => {setChapter(c);setVerseStart(1);setVerseEnd(1);setCurrentVerse(1);setWaitingForEnd(false);}} className={`min-w-9 h-9 px-2 rounded-lg text-[11px] font-black border ${chapter === c ? 'bg-amber-500 border-amber-300 text-slate-950' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}`}>{c}</button>)}
                    </div>
                  </div>
                  <div className="mt-4">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[9px] font-black tracking-wider text-slate-500 uppercase">Verse</div>
                      <div className="flex rounded-lg bg-slate-800 border border-slate-700 p-0.5">
                        <button onClick={() => setMode(false)} className={`px-3 py-1.5 rounded-md text-[9px] font-black ${!passageMode ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>SINGLE VERSE</button>
                        <button onClick={() => setMode(true)} className={`px-3 py-1.5 rounded-md text-[9px] font-black ${passageMode ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>PASSAGE</button>
                      </div>
                    </div>
                    {passageMode && <div className="text-[10px] text-amber-300 mb-2">{waitingForEnd ? `Start: verse ${verseStart}. Now click the last verse.` : verseEnd > verseStart ? `${passageReference} selected · ${passageVerses.length} slides` : 'Click the first verse, then click the last verse.'}</div>}
                    <div className="flex flex-wrap gap-1.5">
                      {verses.map(v => <button key={v} onClick={() => selectVerse(v)} className={`w-9 h-9 rounded-lg text-[11px] font-black border ${v >= verseStart && v <= verseEnd ? (v === currentVerse ? 'bg-rose-600 border-rose-400 text-white' : 'bg-indigo-600 border-indigo-400 text-white') : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}`}>{v}</button>)}
                    </div>
                  </div>
                  <div className="mt-5 rounded-2xl border border-slate-700 bg-white text-center p-7 min-h-64 flex flex-col justify-center">
                    <div className="text-xs font-black tracking-widest text-indigo-600 uppercase mb-4">{reference}</div>
                    <p className="text-xl md:text-2xl font-bold leading-relaxed text-slate-900 normal-case">{english || 'English text unavailable for this reference.'}</p>
                    <div className="w-20 h-1 bg-indigo-500 mx-auto my-5 rounded-full"></div>
                    <p lang="ta" className="text-2xl md:text-3xl font-bold leading-relaxed text-black normal-case">{tamil || 'இந்த வசனத்திற்கான தமிழ் உரை கிடைக்கவில்லை.'}</p>
                  </div>
                </main>
              </div>
            )}
            <div className="px-5 py-3 border-t border-slate-800 flex justify-between items-center shrink-0">
              <span className="text-[10px] text-slate-500">{passageMode && passageVerses.length > 1 ? `${passageReference} · slide ${passageVerses.indexOf(currentVerse) + 1} of ${passageVerses.length}` : 'English and Tamil go live together.'}</span>
              <div className="flex items-center gap-2">
                {passageMode && passageVerses.length > 1 && <>
                  <button onClick={() => movePassage(-1)} disabled={currentVerse === passageVerses[0]} className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white text-[10px] font-black">◀ PREVIOUS</button>
                  <button onClick={() => movePassage(1)} disabled={currentVerse === passageVerses[passageVerses.length - 1]} className="px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 text-white text-[10px] font-black">NEXT ▶</button>
                </>}
                <button onClick={() => presentVerse()} disabled={status !== 'ready' || waitingForEnd || (!english && !tamil)} className="px-8 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-30 text-white text-xs font-black tracking-[0.16em]">● GO LIVE</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  PASTE LYRICS MODAL
    // ============================================================
    function PasteLyricsModal({ onClose, onSubmit }) {
      const [title, setTitle] = useState('');
      const [groupName, setGroupName] = useState('');
      const [rawText, setRawText] = useState('');
      const [downloaded, setDownloaded] = useState(false);

      const cleanedText = useMemo(() => cleanPastedLyrics(rawText), [rawText]);
      const preview = useMemo(() => cleanedText ? parseLyricsToSlides('preview', cleanedText) : { slides: [], sectionsJson: [] }, [cleanedText]);

      const handleSubmit = () => {
        if (!cleanedText) return;
        onSubmit(title, cleanedText, groupName);
      };

      const handleClean = () => setRawText(cleanedText);

      const handleDownload = async () => {
        if (!cleanedText) return;
        const fallbackTitle = cleanedText.split('\n').map(line => line.trim()).find(line => line && !/^\[.+\]$/.test(line)) || 'New Song';
        const saved = await downloadSongText(title || fallbackTitle, groupName, cleanedText);
        if (saved) {
          setDownloaded(true);
          setTimeout(() => setDownloaded(false), 2500);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-6">
          <div className="w-full max-w-4xl max-h-[94vh] flex flex-col bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl shadow-indigo-900/30 overflow-hidden">
            {/* Modal header */}
            <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
              <div>
                <h2 className="text-sm font-black tracking-widest text-white uppercase">Paste Your Lyrics Here</h2>
                <p className="text-[10px] text-slate-500 mt-0.5">Clean copied text · preview slides · download a Notepad file</p>
              </div>
              <button
                onClick={onClose}
                className="text-slate-500 hover:text-white text-lg font-bold transition"
              >✕</button>
            </div>

            {/* Modal body */}
            <div className="p-6 space-y-4 overflow-y-auto">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] font-black tracking-widest text-slate-400 uppercase block mb-1.5">Song Title <span className="text-slate-600 normal-case font-normal">(blank = first line)</span></label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="e.g. Way Maker"
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 placeholder:text-slate-600"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-black tracking-widest text-slate-400 uppercase block mb-1.5">Group / Singer Name</label>
                  <input
                    type="text"
                    value={groupName}
                    onChange={(e) => setGroupName(e.target.value)}
                    placeholder="e.g. Worship Team"
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 placeholder:text-slate-600"
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="text-[10px] font-black tracking-widest text-slate-400 uppercase">Raw Lyrics</label>
                  <button onClick={handleClean} disabled={!rawText.trim()} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-[9px] font-black text-indigo-300 uppercase">✨ Clean Copied Text</button>
                </div>
                <textarea
                  rows="10"
                  value={rawText}
                  onChange={(e) => setRawText(e.target.value)}
                  placeholder={'[Verse 1]\nYou are here moving in our midst\n\n[Chorus]\nWay maker miracle worker promise keeper'}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm font-mono text-slate-200 focus:outline-none focus:border-indigo-500 placeholder:text-slate-600 resize-none"
                />
                <p className="text-[10px] text-slate-500 mt-1.5">
                  💡 Use <code className="text-indigo-400">[Verse 1]</code>, <code className="text-indigo-400">[Chorus]</code>, <code className="text-indigo-400">[Bridge]</code> etc. to mark sections. Lyric lines are paired (2 lines per slide); long phrases auto-wrap at max 5 words per line.
                </p>
              </div>

              {preview.slides.length > 0 && (
                <div className="rounded-xl border border-slate-700 bg-slate-950/70 p-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-[10px] font-black tracking-widest text-slate-400 uppercase">Slide Preview</span>
                    <span className="text-[9px] text-indigo-400 font-bold">{preview.sectionsJson.length} sections · {preview.slides.length} slides</span>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-48 overflow-y-auto">
                    {preview.slides.map((slide, index) => (
                      <div key={slide.id} className="rounded-lg border border-slate-800 bg-slate-900 p-2">
                        <div className="text-[8px] font-black text-indigo-400 mb-1">{slide.tag} · {index + 1}</div>
                        <div className="text-[10px] font-bold text-slate-300 whitespace-pre-wrap uppercase">{slide.content}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Modal footer */}
            <div className="px-6 py-4 border-t border-slate-800 flex justify-end gap-3">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-[11px] font-black uppercase text-slate-300 border border-slate-700 transition"
              >
                Cancel
              </button>
              <button
                onClick={handleDownload}
                disabled={!cleanedText}
                className="px-5 py-2 rounded-lg text-[11px] font-black uppercase text-white bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 transition"
              >
                {downloaded ? '✅ Downloaded' : '⬇ Download .txt'}
              </button>
              <button
                onClick={handleSubmit}
                className="px-5 py-2 rounded-lg text-[11px] font-black uppercase text-white transition"
                style={{ background: ACCENT, boxShadow: `0 4px 20px ${ACCENT}40` }}
              >
                Add to Service + Cloud
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  ROOT APP — route based on URL mode
    // ============================================================
    function App() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'projector') return <ProjectorStage />;
      return <PresenterConsole />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
